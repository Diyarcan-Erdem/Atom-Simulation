<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Quantum Atom 3D — Diyarcan</title>
    <style>
        body {
            margin: 0;
            background: #020408;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: #f8fafc;
            margin: 0;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }
        .author {
            font-size: 0.9rem;
            color: #38bdf8;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }
        button {
            background: rgba(15, 23, 42, 0.8);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        button:hover {
            background: #38bdf8;
            color: #020408;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }
    </style>
    <!-- Подключаем Three.js для полноценного 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="header">
        <h1>QUANTUM ATOM 3D SIMULATION</h1>
        <div class="author">Created by Diyarcan</div>
    </div>

    <div class="controls">
        <button onclick="changeOrbital('1s')">Hydrogen (1s)</button>
        <button onclick="changeOrbital('2p')">Orbital (2p)</button>
        <button onclick="changeOrbital('3d')">Orbital (3d)</button>
    </div>

    <script>
        let scene, camera, renderer, cloudGroup, nucleus;
        let currentType = '1s';
        let clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020408, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Создаем ядро атома (светящаяся сфера в центре в стиле видео)
            const nucleusGeometry = new THREE.SphereGeometry(1.2, 32, 32);
            const nucleusMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff3366,
                wireframe: false
            });
            nucleus = new THREE.Mesh(nucleusGeometry, nucleusMaterial);
            scene.add(nucleus);

            // Создаем облако электронов (3D точки)
            createElectronCloud('1s');

            window.addEventListener('resize', onWindowResize);
        }

        function createElectronCloud(type) {
            if (cloudGroup) scene.remove(cloudGroup);
            cloudGroup = new THREE.Group();

            const particleCount = 12000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                
                if (type === '1s') {
                    // Сферическое облако 1s (плотное у центра)
                    const u = Math.random();
                    const r = 8 * Math.cbrt(u);
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } else if (type === '2p') {
                    // Гантелеобразная форма 2p орбитали
                    const theta = Math.random() * 2 * Math.PI;
                    const u = Math.random();
                    const r = 10 * Math.pow(Math.random(), 0.5);
                    const zFactor = (Math.random() - 0.5) * 6;
                    x = r * Math.cos(theta) * 0.6;
                    y = r * Math.sin(theta) * 0.6;
                    z = zFactor * (Math.random() + 0.5);
                } else {
                    // Сложная форма 3d орбитали (множественные лепестки)
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = 12 * Math.random() * Math.abs(Math.sin(2 * phi));
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Материал точек (неоновое свечение в точности как в видео)
            const material = new THREE.PointsMaterial({
                color: 0x38bdf8,
                size: 0.25,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particleSystem = new THREE.Points(geometry, material);
            cloudGroup.add(particleSystem);
            scene.add(cloudGroup);
        }

        function changeOrbital(type) {
            currentType = type;
            createElectronCloud(type);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Плавное вращение всей квантовой структуры в 3D
            if (cloudGroup) {
                cloudGroup.rotation.y = elapsedTime * 0.15;
                cloudGroup.rotation.x = Math.sin(elapsedTime * 0.1) * 0.2;
            }

            // Легкая пульсация ядра
            if (nucleus) {
                const scale = 1 + Math.sin(elapsedTime * 3) * 0.05;
                nucleus.scale.set(scale, scale, scale);
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
